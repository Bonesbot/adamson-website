[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions. `submission-created` is auto-invoked by Netlify after
# every verified form submission and mirrors wishlist entries into Supabase.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# LongboatLido.com spinoff (the `longboatlido` Netlify project, SITE=lll build)
# This file is shared by both Netlify projects; every rule below is scoped to
# an explicit host, so it only fires on the project that serves that domain.
# ---------------------------------------------------------------------------

# ccshores.com: Country Club Shores mailer vanity domain. Always a 301 to the
# canonical page, with UTM tags so mailer traffic is separable in analytics.
# Inert until ccshores.com DNS points at the longboatlido project.
[[redirects]]
  from = "https://ccshores.com/*"
  to = "https://longboatlido.com/country-club-shores/?utm_source=mailer&utm_medium=direct-mail&utm_campaign=ccshores"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ccshores.com/*"
  to = "https://longboatlido.com/country-club-shores/?utm_source=mailer&utm_medium=direct-mail&utm_campaign=ccshores"
  status = 301
  force = true

