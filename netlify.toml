[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions. `submission-created` is auto-invoked by Netlify after
# every verified form submission and mirrors wishlist entries into Supabase.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# LongboatLido.com spinoff (the `longboatlido` Netlify project, SITE=lll build)
# This file is shared by both Netlify projects; every rule below is scoped to
# an explicit host, so it only fires on the project that serves that domain.
# ---------------------------------------------------------------------------

# ccshores.com: Country Club Shores mailer vanity domain. Handled entirely at
# GoDaddy via domain forwarding (301, forward-only, HTTPS) to
#   https://longboatlido.com/country-club-shores/?utm_source=mailer&utm_medium=direct-mail&utm_campaign=ccshores
# Deliberately NOT a Netlify domain: one less project/domain to manage here.
# If forwarding ever moves off GoDaddy, host-scoped [[redirects]] blocks like
# the one below are the Netlify-side pattern.

# Live since the 2026-08-28 DNS cutover: the old hub URL 301s to the new
# domain, carrying its earned authority. The hub page file was removed in the
# same commit.
[[redirects]]
  from = "https://adamsonfl.com/longboat-key/country-club-shores"
  to = "https://longboatlido.com/country-club-shores/"
  status = 301
  force = true

# SRQMAP-HIDDEN 2026-09-02: belt-and-braces de-index of the SRQmap pages while
# they are hidden from the hub site. The pages stay live (srqmap.com 302s to
# /srqmap/), they just carry noindex at the HTTP layer too. Delete to restore.
[[headers]]
  for = "/srqmap/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/SRQmap/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/srq-map/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# mls-watchdog: off-machine dead-man's-switch for the daily MLS export.
# Runs at 14:00 UTC (10am EDT / 9am EST), a few hours after the mini-PC job's
# ~6:50am ET window, so a normal run has had time to land. It queries Postgres
# for the newest import_batches row and emails Ryan via Resend if nothing has
# loaded in MLS_STALE_HOURS (default 26).
# Deliberately hosted here, NOT on the mini-PC: the 2026-08-26..09-01 outage
# went unseen for 8 days because the old watchdog shared the machine and the
# Gmail path with the job it was supposed to be watching.
# ---------------------------------------------------------------------------
[functions."mls-watchdog"]
  schedule = "0 14 * * *"
